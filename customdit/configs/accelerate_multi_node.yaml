compute_environment: LOCAL_MACHINE
debug: false
deepspeed_config:
  deepspeed_config_file: configs/ds_config.json
  deepspeed_multinode_launcher: standard
distributed_type: DEEPSPEED
downcast_bf16: 'no'
enable_cpu_affinity: false
machine_rank: 0
main_training_function: main
main_process_ip: null  # Set to master node IP
main_process_port: 12345
dynamo_backend: 'no'
num_machines: 8  # Set to number of nodes
num_processes: 64  # Total GPUs = num_machines × GPUs_per_node
rdzv_backend: static
same_network: true
tpu_env: []
tpu_use_cluster: false
tpu_use_sudo: false
use_cpu: false
